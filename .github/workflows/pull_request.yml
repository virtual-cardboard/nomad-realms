name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    # Pinned while tests settle; ubuntu-latest migrated to Ubuntu 26 and the
    # screenshot test environment changed underneath it (see PR #421).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install dependencies for OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgles2-mesa-dev libxkbcommon-dev

      - name: Build with Maven
        run: mvn clean install -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with Maven
        run: xvfb-run -a mvn test -DrunScreenshotTest=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
